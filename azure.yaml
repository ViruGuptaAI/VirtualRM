# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: virtualrm
metadata:
  template: virtualrm-voice-agent
hooks:
  postdeploy:
    windows:
      shell: pwsh
      run: ./hooks/postdeploy.ps1
    posix:
      shell: sh
      run: ./hooks/postdeploy.sh
services:
  app:
    project: .
    host: containerapp
    language: python
    docker:
      path: Dockerfile
      remoteBuild: true
